app-id: com.github.dail8859.NotepadNext
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk

rename-icon: NotepadNext
rename-desktop-file: NotepadNext.desktop
command: NotepadNext

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=home

modules:
  - qt65.yml

  - name: NotepadNext
    buildsystem: cmake-ninja
    config-opts:
      - -DAPP_DISTRIBUTION=Flatpak
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DCMAKE_PREFIX_PATH=/app
    post-install:
      - install -D -m644 deploy/linux/com.github.dail8859.NotepadNext.metainfo.xml
        -t /app/share/metainfo
    sources:
      - type: git
        url: https://github.com/dail8859/NotepadNext.git
        tag: v0.14
        commit: 0c63b760ae82bb0eabbf070030454bae9df9ab5b
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
      - type: git
        url: https://github.com/githubuser0xFFFF/Qt-Advanced-Docking-System.git
        commit: 34b68d6eab1556cf851d24e033909332771f3dfe
        dest: thirdparty/ads
      - type: git
        url: https://github.com/alex-spataru/QSimpleUpdater.git
        commit: 8e7017f7fbdc2b4b1a26ed1eef9ebcba6a50639c
        dest: thirdparty/QSimpleUpdater
      - type: git
        url: https://github.com/itay-grudev/SingleApplication.git
        commit: 494772e98cef0aa88124f154feb575cc60b08b38
        dest: thirdparty/SingleApplication
      - type: git
        url: https://github.com/editorconfig/editorconfig-core-qt.git
        commit: ab62f0554abf2bbe4d45427b36a8b2f81ca7b4ab
        dest: thirdparty/editorconfig-core-qt
      - type: patch
        path: no-cpm-download.patch